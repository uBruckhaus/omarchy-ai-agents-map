# Goose (aaif-goose/goose, formerly block/goose) (docs/adapter-format.md): facts only, nothing in this
# file runs. Its settings are ~/.config/goose/config.yaml (provider, model, extensions = MCP servers);
# API keys are in the system keyring or ~/.config/goose/secrets.yaml (never read). Sources:
# goose-docs.ai/docs/guides/config-files, .../getting-started/installation, .../using-skills.
command = "goose"
name = "Goose"
label = "Goose"
icon = "U+F01E5"
spec = "github:aaif-goose/goose"
homepage = "https://github.com/aaif-goose/goose"
data = ["~/.config/goose", "~/.local/share/goose"]
home = "~/.config/goose"
activity = ["~/.local/share/goose/sessions"]

[[install]]                            # its GitHub release through mise (no install script piped to a shell)
kind = "mise"
spec = "github:aaif-goose/goose"

[subagents]
format = "goose-db"
path = "~/.local/share/goose/sessions/sessions.db"

[sessions]
reader = "goose-db"                    # a reader the app has (~/.local/share/goose/sessions/sessions.db)
note = "Numbers from {0}'s session database (no text is read). The API value is what the tokens would cost at API prices, not what a plan costs."
note_args = ["Goose"]

[skills]                               # its own folder, and the shared ones it reads itself (and .agents/skills in a project)
dirs = ["~/.config/goose/skills", "~/.agents/skills", "~/.claude/skills"]
own = "~/.config/goose/skills"

[mcp]                                  # its extensions: stdio or streamable_http entries with their name inside
path = "~/.config/goose/config.yaml"
format = "yaml"
key = "extensions"
shape = "goose"

[access]
how = "An API key or sign-in for a provider (OpenRouter, Anthropic, OpenAI, Google …), or a local LLM from the map"
login = "goose configure"
files = [".config/goose/secrets.yaml"]  # only whether it is there; the keyring otherwise
env = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GOOGLE_API_KEY", "OPENROUTER_API_KEY"]
local_ok = true

[[access.logins]]
label = "Choose a provider (goose configure)"
argv = ["goose", "configure"]

# Its own setup command, in a terminal tab (Configure… on the map)
[[configure]]
label = "Configure"
argv = ["goose", "configure"]

[details]                              # its model and providers (the agent's card)
reader = "goose"

# AI Project Center: session-only permission scope; never changes global settings.
# From documentation, not checked against an installed binary (goose v1.60.2):
# https://github.com/aaif-goose/goose/blob/main/documentation/docs/guides/goose-cli-commands.md (run: -t,
# -q, --no-session, --with-builtin, --provider, --model), .../guides/managing-tools/goose-permissions.md,
# and source crates/goose-cli/src/cli.rs + session/builder.rs at v1.60.2 (`--no-profile` loads none of
# the configured extensions or project plugin MCP servers, only the ones named on the command line).
# Goose has no sandbox, so this profile is read-only: its one tool is the built-in "analyze" extension
# (tree-sitter structure, signatures and call graphs; no file contents, no edits, no shell), which takes
# absolute paths too. Planning and execution keep the user's own goose mode (default "auto"); with
# "approve" a headless run stops at its first tool call (session/mod.rs), with "chat" it has no tools.
# Setup has no extension at all and runs with GOOSE_MODE=chat.
[project]
setup = ["goose", "run", "--no-profile", "--no-session", "-q", "-t", "{prompt}"]
plan = ["goose", "run", "--no-profile", "--with-builtin", "analyze", "--no-session", "-q", "-t", "{prompt}"]
run = ["goose", "run", "--no-profile", "--with-builtin", "analyze", "--no-session", "-q", "-t", "{prompt}"]
permissions = "Planning, review and execution only see code structure (files, signatures, call graphs) through goose's built-in analyze tool; it cannot read whole files, edit or run commands, but it is not fenced to the project folder. Goose has no filesystem sandbox; its other extensions and MCP servers are not loaded in this managed profile."
# Stays read-only (the analyze tool only; goose has no filesystem sandbox).
access_modes = ["read-only"]
model_option = "--model"
provider_option = "--provider"

[project.env.setup]                    # no tools at all (also if goose ever loads one by default)
GOOSE_MODE = "chat"

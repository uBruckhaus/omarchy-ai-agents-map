# Pi (docs/adapter-format.md). Connecting a local LLM (two files) and writing its skill folder list are
# hooks (pi.py); everything else is facts.
command = "pi"
name = "Pi"
label = "Pi"
full_name = "Pi"
icon = "U+E901"
icon_font = "omarchy"
usage = "pi"
homepage = "https://github.com/badlogic/pi-mono"
data = ["~/.pi"]
home = "~/.pi/agent"
activity = ["~/.pi/agent/sessions"]

[replies]                              # its session files: the map's usage statistics box
folder = "~/.pi/agent/sessions"
depth = 1
format = "pi-jsonl"

[[install]]
kind = "mise"
spec = "pi"

[local_llm]
files = ["~/.pi/agent/models.json", "~/.pi/agent/settings.json"]
hooks = true

[sessions]
reader = "pi-files"               # a reader the app has (~/.pi/agent/sessions)
note = "Numbers from {0}'s session files (no text is read). The API value is what the tokens would cost at API prices, not what a plan costs."
note_args = ["Pi"]

[skills]
dirs = ["~/.pi/agent/skills", "~/.agents/skills"]
own = "~/.pi/agent/skills"
settings_list = true
settings_file = "~/.pi/agent/settings.json"
listed = { file = "~/.pi/agent/settings.json", format = "json", key = "skills" }
write = "hook"

[mcp]
path = "~/.pi/agent/mcp.json"

[ask]                                  # one prompt, one answer, no tools (the chess page)
argv = ["pi", "-p", "--no-tools", "--no-approve", "{prompt}"]
games = ["chess"]                      # its menu offers Play chess
effort = { quick = ["--thinking", "low"], normal = ["--thinking", "medium"], deep = ["--thinking", "high"], max = ["--thinking", "max"] }   # Thinking time
note = "no tools, project files ignored"

[access]
how = "Sign in inside Pi (/login: Claude, ChatGPT, Copilot …), an API key, or a local LLM from the map"
login = "pi  →  /login"
files = [".pi/agent/auth.json"]
env = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
local_ok = true

[[access.logins]]
label = "Inside Pi"
argv = ["pi"]
note = "Type /login in it."

[security]
asks = "defaultTools"     # the setting that says when it asks first
file = "~/.pi/agent/settings.json"
format = "json"
note = "Pi never asks before it acts, by design: the tools it has are its permissions. Run it in a container or VM, or give it read-only tools, when it works on something you do not trust."

[[security.settings]]
key = "defaultTools"
title = "Tools"
explain = "What Pi can do at all."
current_if = "list"
recommended = ["read", "grep", "find", "ls"]
terms = ["tools", "approval"]
choices = [
  { value = ["read", "bash", "edit", "write", "grep", "find", "ls"], label = "Read, write and run commands", explain = "Edits files and runs any shell command, without asking.", risk = 3 },
  { value = ["read", "grep", "find", "ls"], label = "Read only", explain = "Reads and searches files; changes nothing, runs nothing.", risk = 0 },
  { unset = true, label = "Pi's default", explain = "read, bash, edit, write: changes files and runs commands.", risk = 3 },
]

[details]                              # its model and providers (the agent's card)
reader = "pi"
dir = "~/.pi/agent"

[tools]                                # the tools it is given
file = "~/.pi/agent/settings.json"
key = "defaultTools"

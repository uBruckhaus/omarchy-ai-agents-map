# Google's Antigravity CLI (docs/adapter-format.md): facts only, nothing in this file runs. Its own
# settings are ~/.gemini/antigravity-cli/settings.json (model, agentMode, toolPermission, sandbox,
# permissions); MCP servers ~/.gemini/config/mcp_config.json (shared with the Antigravity IDE:
# command/args/env, or serverUrl for Streamable HTTP; no httpUrl, no SSE); skills
# ~/.gemini/antigravity-cli/skills (and .agents/skills in a project). Sources:
# antigravity.google/docs/settings?tab=cli, /docs/mcp, /docs/skills, /docs/getting-started?tab=cli.
command = "agy"
name = "Antigravity CLI"
label = "Antigravity"
full_name = "Antigravity CLI"
icon = "U+F02AD"
installer = "agy"
offered = false                        # not in Omarchy's agent menu (only this app offers it)
spec = "antigravity-cli"
homepage = "https://antigravity.google"
data = ["~/.gemini/antigravity-cli", "~/.gemini/config", "~/.gemini/antigravity"]
home = "~/.gemini/antigravity-cli"
activity = ["~/.gemini/antigravity-cli"]
web_search = true                      # searches the web itself (Google Search grounding)

[sessions]                             # its conversations: What is it doing? and Collect history
extra_dir_option = "--add-dir"
activity_reader = "trajectory-sqlite"
activity_dir = "~/.gemini/antigravity-cli/conversations"

[details]                              # its model: the one its newest log says it selected
reader = "agy"

[[install]]                            # its release through mise (aqua, checksummed)
kind = "mise"
spec = "antigravity-cli"

[[install]]
kind = "installer"

[skills]                               # its own folder (and .agents/skills in a project)
dirs = ["~/.gemini/antigravity-cli/skills"]
own = "~/.gemini/antigravity-cli/skills"

[mcp]
path = "~/.gemini/config/mcp_config.json"
shape = "antigravity"

[access]
how = "A Google account (free tier or Google AI plan), or a Gemini API key from aistudio.google.com"
login = "agy"
files = [".gemini/antigravity-cli/history.jsonl"]  # its sign-in is in the keyring; only a used agent has this
env = ["GEMINI_API_KEY"]

[[access.logins]]
label = "Google account"
argv = ["agy"]
note = "Choose “Sign in with Google” when it asks."

[security]
sandbox = "enableTerminalSandbox"      # the setting that is its sandbox
asks = "toolPermission"                # the setting that says when it asks first
file = "~/.gemini/antigravity-cli/settings.json"
format = "json"

[[security.settings]]
key = "toolPermission"
title = "When Antigravity asks"
explain = "Whether Antigravity asks before it runs a tool, such as a command or a file change."
default = "request-review"
recommended = "request-review"
terms = ["approval", "sandbox"]
choices = [
  { value = "strict", label = "Strict", explain = "Asks before every tool, even reading.", risk = 0 },
  { value = "request-review", label = "Ask first", explain = "Asks before it runs a command or changes a file.", risk = 1 },
  { value = "proceed-in-sandbox", label = "Go ahead in the sandbox", explain = "Runs commands in its sandbox without asking.", risk = 2 },
  { value = "always-proceed", label = "Never ask", explain = "Runs every tool without asking. Only for a throwaway machine.", risk = 3 },
]

[[security.settings]]
key = "agentMode"
title = "Agent mode"
explain = "How much Antigravity may do on its own. It can be changed for one session in the CLI."
default = "default"
recommended = "default"
terms = ["approval"]
choices = [
  { value = "default", label = "Normal", explain = "Follows “When Antigravity asks”.", risk = 1 },
  { value = "plan", label = "Plan only", explain = "Reads and plans; changes nothing until you agree.", risk = 0 },
  { value = "accept-edits", label = "Edit without asking", explain = "Edits files on its own, asks before commands.", risk = 2 },
  { value = "auto", label = "Automatic (preview)", explain = "Decides on its own which actions need your OK.", risk = 2 },
]

[[security.settings]]
key = "enableTerminalSandbox"
title = "Sandbox for commands"
explain = "Runs terminal commands in a sandbox."
default = "off"
recommended = "on"
terms = ["sandbox"]
choices = [
  { value = "on", label = "On", explain = "Commands are fenced in.", risk = 0 },
  { value = "off", label = "Off", explain = "Commands run with all your rights.", risk = 1 },
]

[[security.settings]]
key = "allowNonWorkspaceAccess"
title = "Files outside the project"
explain = "Whether Antigravity may read and write files outside the project folder."
default = "off"
recommended = "off"
terms = ["sandbox"]
choices = [
  { value = "off", label = "Project only", explain = "Stays inside the project folder.", risk = 0 },
  { value = "on", label = "Anywhere", explain = "May touch any file you can.", risk = 2 },
]

[[security.rules]]
key = "permissions.allow"
title = "Allowed without asking"

[[security.rules]]
key = "permissions.ask"
title = "Always ask"

[[security.rules]]
key = "permissions.deny"
title = "Never allowed"

[[security.rules]]
key = "trustedWorkspaces"
title = "Trusted folders"

[project]                              # AI Project Center (project_center.py): managed plan/run/setup commands, facts only
plan = ["agy", "--mode", "plan", "--sandbox", "--settings", "{\"toolPermission\":\"request-review\",\"allowNonWorkspaceAccess\":false,\"permissions\":{\"allow\":[]}}", "-p", "{prompt}"]
run = ["agy", "--mode", "accept-edits", "--sandbox", "--settings", "{\"toolPermission\":\"request-review\",\"allowNonWorkspaceAccess\":false,\"permissions\":{\"allow\":[]}}", "-p", "{prompt}"]
permissions = "Planning and review use plan mode. Edit project files: edits project files in the sandbox; commands needing approval are denied. Edit + commands: also runs build, test, install and git commit commands from a fixed list in its sandbox, git push only with Allow push. agy stops at the first other command and leaves the rest undone."
# Edit + commands (probed with agy 1.5.14 on 2026-11-24): permissions.allow command(...) rules
# let these commands run without review in print mode (prefix rules: "command(cargo test)" allows
# "cargo test --offline"; probed with "command(cargo)"). Only subcommands that build, test or check; no
# make (a prefix rule would also allow "make build --eval=..." and so any command). Probed: cargo test, ./install.sh (writes ~/.local), git commit; git push only with
# command(git push) (run_commands_push). Re-probed with agy 1.5.15 (2026-11-24): allowed commands
# DO have network in --sandbox (command(curl), command(git ls-remote) both reached the net), so cargo build,
# flutter pub get, npm ci or a git push over https can fetch; generic network commands (curl, wget, npm
# install, pip install) are not in the allow list and stay denied, so network stays false. The user's
# permissions.deny in ~/.gemini/antigravity-cli/settings.json still wins over this permissions.allow (a deny
# rule for command(git push) still blocks the push). plan and run set "allow": [] because without it agy
# inherits the user's permissions.allow (probed: "git log" ran in a run).
# agy ends its turn at the first command it may not run and exits 0 without a report: denied_marker.
run_commands = ["agy", "--mode", "accept-edits", "--sandbox", "--settings", "{\"toolPermission\":\"request-review\",\"allowNonWorkspaceAccess\":false,\"permissions\":{\"allow\":[\"command(cargo build)\",\"command(cargo test)\",\"command(cargo check)\",\"command(cargo clippy)\",\"command(cargo fmt)\",\"command(flutter build)\",\"command(flutter test)\",\"command(flutter analyze)\",\"command(flutter pub get)\",\"command(dart test)\",\"command(dart analyze)\",\"command(dart format)\",\"command(npm test)\",\"command(npm ci)\",\"command(npm run build)\",\"command(npm run test)\",\"command(pnpm test)\",\"command(pnpm run build)\",\"command(python3 -m unittest)\",\"command(python3 -m pytest)\",\"command(pytest)\",\"command(tools/test-changed)\",\"command(./install.sh)\",\"command(./build.sh)\",\"command(makepkg)\",\"command(pgrep)\",\"command(git status)\",\"command(git diff)\",\"command(git log)\",\"command(git show)\",\"command(git add)\",\"command(git commit)\",\"command(git rev-parse)\",\"command(git branch)\"]}}", "-p", "{prompt}"]
run_commands_push = ["agy", "--mode", "accept-edits", "--sandbox", "--settings", "{\"toolPermission\":\"request-review\",\"allowNonWorkspaceAccess\":false,\"permissions\":{\"allow\":[\"command(cargo build)\",\"command(cargo test)\",\"command(cargo check)\",\"command(cargo clippy)\",\"command(cargo fmt)\",\"command(flutter build)\",\"command(flutter test)\",\"command(flutter analyze)\",\"command(flutter pub get)\",\"command(dart test)\",\"command(dart analyze)\",\"command(dart format)\",\"command(npm test)\",\"command(npm ci)\",\"command(npm run build)\",\"command(npm run test)\",\"command(pnpm test)\",\"command(pnpm run build)\",\"command(python3 -m unittest)\",\"command(python3 -m pytest)\",\"command(pytest)\",\"command(tools/test-changed)\",\"command(./install.sh)\",\"command(./build.sh)\",\"command(makepkg)\",\"command(pgrep)\",\"command(git status)\",\"command(git diff)\",\"command(git log)\",\"command(git show)\",\"command(git add)\",\"command(git commit)\",\"command(git rev-parse)\",\"command(git branch)\",\"command(git push)\"]}}", "-p", "{prompt}"]
denied_marker = "jetski: no output produced"
model_option = "--model"
[project.capabilities.project-edit]
edit = true
[project.capabilities.project-commands]
edit = true
shell = true
outside_project = true
git_commit = true
[project.capabilities.project-commands-push]
edit = true
shell = true
outside_project = true
git_commit = true
git_push = true

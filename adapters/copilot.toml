# GitHub Copilot CLI (docs/adapter-format.md): facts only, nothing in this file runs.
command = "copilot"
name = "GitHub Copilot"
package = "github-copilot-cli"                 # Omarchy 4.6 installs it as this pacman package
label = "Copilot"
full_name = "GitHub Copilot"
icon = "U+F4B8"
homepage = "https://github.com/github/copilot-cli"
data = ["~/.copilot"]
home = "~/.copilot"
activity = ["~/.copilot/session-state"]
web_search = true                      # searches the web itself (no MCP server needed)

[[install]]
kind = "mise"
spec = "copilot"

[subagents]
format = "copilot-events"
path = "~/.copilot/session-state"

[skills]
dirs = ["~/.copilot/skills", "~/.agents/skills"]
own = "~/.copilot/skills"

[mcp]
path = "~/.copilot/mcp-config.json"
shape = "copilot"

[access]
how = "A GitHub Copilot subscription (github.com/features/copilot)"
login = "copilot  →  /login"
files = [".copilot/config.json"]
env = ["COPILOT_GITHUB_TOKEN", "GH_TOKEN"]

[[access.logins]]
label = "GitHub account"
argv = ["copilot"]
note = "Type /login in it."

[security]
asks = "defaultPermissionMode"     # the setting that says when it asks first
file = "~/.copilot/settings.json"
format = "json"

[[security.settings]]
key = "defaultPermissionMode"
title = "Permission mode"
explain = "How new interactive Copilot sessions start."
default = "manual"
recommended = "manual"
terms = ["approval", "classifier", "bypass"]
choices = [
  { value = "manual", label = "Ask first", explain = "Asks before writes and commands; reading is allowed.", risk = 1 },
  { value = "assisted", label = "Automatic review", explain = "An AI review approves what it judges safe and asks about the rest.", risk = 2 },
  { value = "allow-all", label = "Allow everything", explain = "Approves everything, like --allow-all.", risk = 3 },
]

[[security.rules]]
key = "trustedFolders"
title = "Trusted folders"
also = "~/.copilot/config.json"        # Copilot's managed file holds the list when the settings do not

[[security.rules]]
key = "allowedUrls"
title = "Sites without asking"
also = "~/.copilot/config.json"

[details]                              # its model (the agent's card)
reader = "copilot"

# AI Project Center: session-only permission scope; never changes global settings.
# Checked against `copilot --help`, `copilot help permissions` and `copilot help sandbox` of
# GitHub Copilot CLI 1.0.114 and https://docs.github.com/en/copilot/reference/cli-command-reference
# (tool names for --available-tools). -p denies every tool request no rule approves; shell, URL and
# memory are denied, file paths stay inside the working directory (--disallow-temp-dir). A -p run in
# an untrusted folder skips its workspace MCP servers and repository hooks; user-level hooks and
# plugins cannot be switched off by a flag. No --sandbox: the shell is not available at all.
[project]
plan = ["copilot", "-p", "{prompt}", "-s", "--no-ask-user", "--no-auto-update", "--disable-builtin-mcps", "--disallow-temp-dir", "--available-tools=view,glob,grep,rg", "--deny-tool=shell", "--deny-tool=write", "--deny-tool=url", "--deny-tool=memory"]
run = ["copilot", "-p", "{prompt}", "-s", "--no-ask-user", "--no-auto-update", "--disable-builtin-mcps", "--disallow-temp-dir", "--available-tools=view,glob,grep,rg,edit,create,apply_patch", "--allow-tool=write", "--deny-tool=shell", "--deny-tool=url", "--deny-tool=memory"]
permissions = "Planning and review only read and search project files. Execution may also create and edit files inside the project folder; shell commands, web access, memory and the built-in MCP servers are disabled. Only these file tools reach the model, but your own hooks, plugins and MCP servers still start (and repository hooks in a folder you already trusted in Copilot)."
model_option = "--model"
# Declared from the argv (edit tools, --deny-tool=shell); not verified live. The Omarchy probe
# (1.0.114, 2026-11-24) stopped at "Error: Access denied by policy settings" (the account's policy), so no
# run could prove shell allow rules: Edit project files only, no run_commands / run_commands_push.
[project.capabilities.project-edit]
edit = true

# The user's own environment could switch these on: COPILOT_ALLOW_ALL=true trusts the folder (its
# hooks, MCP servers, skills, plugins), the PROMPT_MODE_* opt-ins load the folder's extensions, repo
# hooks or workspace MCP in -p (cli-main.js 1.0.114, changelog), ASSISTED_APPROVAL lets a judge approve, and
# COPILOT_AUTO_UPDATE=false also stops the plugin updates --no-auto-update leaves on.
# Source: `copilot help environment`, `copilot help extensions` (1.0.114).
[project.env.plan]
COPILOT_ALLOW_ALL = "false"
COPILOT_ASSISTED_APPROVAL = "false"
GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS = "false"
GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS = "false"
GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP = "false"
COPILOT_AUTO_UPDATE = "false"

[project.env.run]
COPILOT_ALLOW_ALL = "false"
COPILOT_ASSISTED_APPROVAL = "false"
GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS = "false"
GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS = "false"
GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP = "false"
COPILOT_AUTO_UPDATE = "false"

# xAI's Grok CLI (docs/adapter-format.md): facts only, nothing in this file runs.
command = "grok"
name = "Grok"
label = "Grok"
icon = "U+E904"
icon_font = "omarchy"
spec = "npm:@xai-official/grok"
homepage = "https://www.npmjs.com/package/@xai-official/grok"
data = ["~/.grok"]
home = "~/.grok"
web_search = true                      # searches the web itself (no MCP server needed)

[details]                              # its model: the one its newest session ran
reader = "grok"

[[install]]
kind = "mise"
spec = "npm:@xai-official/grok"

[skills]
dirs = ["~/.grok/skills"]
own = "~/.grok/skills"
listed = { file = "~/.grok/config.toml", format = "toml", key = "skills.paths" }

[mcp]
path = "~/.grok/config.toml"
format = "toml"
key = "mcp_servers"

[access]
how = "An API key from console.x.ai"
login = "grok"
env = ["XAI_API_KEY"]

# No [project] (AI Project Center) yet: grok is only a lazy mise entry here (not installed), and its docs
# leave open which tools dontAsk still allows, the tool names for --allow, how headless -p handles approval
# prompts and how to switch off MCP and hooks. Candidates once checked against grok --help:
# --sandbox read-only|strict, --permission-mode dontAsk, --allow, --tools, --no-subagents, -m.
# Source: https://docs.x.ai/build/cli/reference, https://docs.x.ai/build/features/sandbox
